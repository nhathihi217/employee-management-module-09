spring.application.name=employee-management-module-09
spring.datasource.url=jdbc:h2:mem:employee_security;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.port=8080
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-deployment-0123456789}
app.jwt.expiration-seconds=900
app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
